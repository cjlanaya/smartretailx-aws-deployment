openapi: 3.0.0
info:
  title: SmartRetailX Payment Service API
  version: 1.0.0
  description: Handles payment processing, refunds and payment history
servers:
  - url: http://localhost:3005/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /payments/process:
    post:
      summary: Process a payment for an order
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount, card_number]
              properties:
                order_id: { type: integer, example: 1 }
                amount: { type: number, example: 1999.98 }
                card_number: { type: string, example: "4111111111111111" }
                card_expiry: { type: string, example: "12/26" }
                card_cvv: { type: string, example: "123" }
      responses:
        '200':
          description: Payment successful
        '402':
          description: Payment failed
        '409':
          description: Order already paid

  /payments/my:
    get:
      summary: Get my payment history
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of payments

  /payments/order/{orderId}:
    get:
      summary: Get payment for a specific order
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Payment details

  /payments:
    get:
      summary: Get all payments (admin only)
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All payments with revenue total

  /payments/refund/{id}:
    post:
      summary: Refund a payment (admin only)
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Payment refunded
