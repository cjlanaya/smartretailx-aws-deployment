version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: smartretailx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartretailx-network

  user-service:
    build: ./user-service
    container_name: smartretailx-user
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  product-service:
    build: ./product-service
    container_name: smartretailx-product
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: smartretailx-order
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    depends_on:
      mysql:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - smartretailx-network
    restart: on-failure

  payment-service:
    build: ./payment-service
    container_name: smartretailx-payment
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    depends_on:
      mysql:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - smartretailx-network
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: smartretailx-notification
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    container_name: smartretailx-inventory
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: smartretailx-frontend
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
      - inventory-service
    networks:
      - smartretailx-network
    stdin_open: true

volumes:
  mysql_data:

networks:
  smartretailx-network:
    driver: bridge
