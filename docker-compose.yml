version: '3.8'

services:

  # ── MySQL Database ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartretailx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartretailx-network

  # ── User Service ────────────────────────────────────────────
  user-service:
    build: ./user-service
    container_name: smartretailx-user
    ports:
      - "3001:3001"
    environment:
      PORT: ${USER_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  # ── Product Service ─────────────────────────────────────────
  product-service:
    build: ./product-service
    container_name: smartretailx-product
    ports:
      - "3002:3002"
    environment:
      PORT: ${PRODUCT_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

  # ── Order Service ───────────────────────────────────────────
  order-service:
    build: ./order-service
    container_name: smartretailx-order
    ports:
      - "3003:3003"
    environment:
      PORT: ${ORDER_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - smartretailx-network
    restart: on-failure

  # ── Inventory Service ───────────────────────────────────────
  inventory-service:
    build: ./inventory-service
    container_name: smartretailx-inventory
    ports:
      - "3004:3004"
    environment:
      PORT: ${INVENTORY_SERVICE_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartretailx-network
    restart: on-failure

volumes:
  mysql_data:

networks:
  smartretailx-network:
    driver: bridge
