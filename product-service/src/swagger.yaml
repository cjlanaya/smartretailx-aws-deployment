openapi: 3.0.0
info:
  title: SmartRetailX Product Catalogue API
  version: 1.0.0
  description: Manages product listings, categories and pricing
servers:
  - url: http://localhost:3002/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        sku: { type: string }
        image_url: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

paths:
  /products:
    get:
      summary: List all products
      tags: [Products]
      parameters:
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: List of products
    post:
      summary: Create a product (admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, sku]
              properties:
                name: { type: string, example: Apple iPhone 15 }
                description: { type: string }
                price: { type: number, example: 999.99 }
                category: { type: string, example: Electronics }
                sku: { type: string, example: IPH15-128-BLK }
                image_url: { type: string }
      responses:
        '201':
          description: Product created

  /products/{id}:
    get:
      summary: Get product by ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product details
        '404':
          description: Product not found
    put:
      summary: Update product (admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Deactivate product (admin only)
      tags: [Products]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Product deactivated
