openapi: 3.0.0
info:
  title: SmartRetailX Order Processing API
  version: 1.0.0
  description: Handles order placement, tracking and status management
servers:
  - url: http://localhost:3003/api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /orders:
    post:
      summary: Place a new order
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shipping_address]
              properties:
                shipping_address: { type: string, example: "123 Main St, Colombo, Sri Lanka" }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      product_name: { type: string }
                      quantity: { type: integer }
                      unit_price: { type: number }
      responses:
        '201':
          description: Order placed successfully
        '400':
          description: Insufficient stock or invalid data
    get:
      summary: Get my orders
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of user orders

  /orders/{id}:
    get:
      summary: Get order details
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order details with items
        '404':
          description: Order not found

  /orders/{id}/status:
    patch:
      summary: Update order status (admin only)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, processing, shipped, delivered, cancelled]
      responses:
        '200':
          description: Status updated

  /orders/admin/all:
    get:
      summary: Get all orders (admin only)
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All orders
